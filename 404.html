<script id="cc-perf-boot">
/* CampusCash display mode: Premium (default) or Lite. Saved in localStorage as "cc-perf", separate from the light/dark theme.
   Runs first in <head> so the saved mode is applied before anything is painted. */
(function(){
  "use strict";
  var KEY="cc-perf", root=document.documentElement, mode="premium", live=null;
  function read(){ try{ return localStorage.getItem(KEY)==="lite" ? "lite" : "premium"; }catch(e){ return mode; } }
  function paint(){ root.setAttribute("data-perf", mode); }
  function sync(){
    var b=document.getElementById("liteMode"); if(!b) return;
    var on=mode==="lite";
    b.setAttribute("aria-pressed", on ? "true" : "false");
    b.title = on ? "Lite Mode is on. Select to return to Premium Mode." : "Lite Mode: lighter visuals that run smoother on older phones.";
  }
  function say(t){
    if(!live){ live=document.createElement("div"); live.className="lm-sr"; live.setAttribute("role","status"); live.setAttribute("aria-live","polite"); document.body.appendChild(live); }
    live.textContent=""; setTimeout(function(){ live.textContent=t; },30);
  }
  mode=read(); paint();
  document.addEventListener("DOMContentLoaded",function(){
    var b=document.getElementById("liteMode"); sync(); if(!b) return;
    b.addEventListener("click",function(){
      mode = mode==="lite" ? "premium" : "lite";
      try{ localStorage.setItem(KEY,mode); }catch(e){}
      paint(); sync(); say(mode==="lite" ? "Lite Mode on" : "Premium Mode on");
    });
  });
  window.addEventListener("storage",function(e){ if(e.key===KEY||e.key===null){ mode=read(); paint(); sync(); } });
  window.addEventListener("pageshow",function(e){ if(e.persisted){ mode=read(); paint(); sync(); } });
})();
</script>

<style id="perf-mode">

<style id="cc-theme-fx-css">
/* Theme-switch transition. These rules are used only while a switch is animating; colours come from the existing tokens. */
.cc-fx{position:fixed;width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:50%;pointer-events:none;z-index:2147483000;will-change:transform}
.cc-fx.wash{view-transition-name:cc-wash;background:radial-gradient(closest-side,transparent 52%,color-mix(in srgb,var(--lime) 24%,transparent) 80%,color-mix(in srgb,var(--ac) 20%,transparent) 90%,transparent 98%)}
.cc-fx.shade{view-transition-name:cc-shade;background:radial-gradient(closest-side,transparent 90%,rgba(0,0,0,.2) 95.5%,transparent 100%)}
.cc-fx.glow{view-transition-name:cc-glow;background:radial-gradient(closest-side,rgba(255,255,255,.3) 0,rgba(255,255,255,.07) 46%,rgba(255,255,255,.06) 62%,color-mix(in srgb,var(--ac) 30%,transparent) 82%,rgba(255,255,255,.62) 92.5%,rgba(255,255,255,0) 96%)}
.cc-fx.echo{view-transition-name:cc-echo;background:radial-gradient(closest-side,transparent 86%,rgba(255,255,255,.5) 92.5%,transparent 97%)}
.cc-fx.core{view-transition-name:cc-core;background:radial-gradient(closest-side,rgba(255,255,255,.95) 0,rgba(255,255,255,.45) 28%,color-mix(in srgb,var(--lime) 28%,transparent) 55%,transparent 100%)}
.cc-fx.orb{background:radial-gradient(closest-side,rgba(255,255,255,.34) 0,rgba(255,255,255,.07) 46%,color-mix(in srgb,var(--ac) 30%,transparent) 82%,rgba(255,255,255,.55) 92.5%,rgba(255,255,255,0) 96%)}

:root.cc-vt::view-transition-group(*),:root.cc-vt::view-transition-image-pair(*){animation:none}
:root.cc-vt::view-transition-old(*),:root.cc-vt::view-transition-new(*){animation:none;mix-blend-mode:normal}
:root.cc-vt::view-transition-new(root){transform-origin:var(--cc-ox,50%) var(--cc-oy,50%)}
/* While it plays: hold decorative loops and colour fades so the revealed theme shows its final colours and nothing repaints needlessly */
:root.cc-vt *,:root.cc-vt *::before,:root.cc-vt *::after{animation-play-state:paused!important}
:root.cc-vt :not(.theme-slider),:root.cc-vt :not(.theme-slider)::before,:root.cc-vt :not(.theme-slider)::after{transition:none!important}

/* fallback (no View Transitions): short colour cross-fade while the orb expands */
:root.cc-fade *,:root.cc-fade *::before,:root.cc-fade *::after{transition:background-color .45s ease,color .45s ease,border-color .45s ease,fill .45s ease,stroke .45s ease,box-shadow .45s ease!important}
</style>
<script id="cc-theme-fx">
/* Liquid-light theme transition. Intercepts a click on the existing #theme control, plays the effect, and re-fires the
   original click inside the transition, so the page's own handler (theme.set, localStorage, icon update) runs unchanged. */
(function(){
  "use strict";
  var root=document.documentElement, busy=false, passing=false;
  var reduce=window.matchMedia?matchMedia("(prefers-reduced-motion: reduce)"):{matches:false};
  var TAU=Math.PI*2, N=72, STEPS=32, SETTLE=.016;
  if(typeof root.animate!=="function") return;

  // cubic-bezier easing (same maths as CSS), used to sample the whole motion so every layer follows one smooth curve
  function bez(x1,y1,x2,y2){
    var cx=3*x1,bx=3*(x2-x1)-cx,ax=1-cx-bx, cy=3*y1,by=3*(y2-y1)-cy,ay=1-cy-by;
    return function(t){
      if(t<=0) return 0; if(t>=1) return 1;
      var u=t,x,d;
      for(var i=0;i<8;i++){ x=((ax*u+bx)*u+cx)*u-t; if(Math.abs(x)<1e-5) break; d=(3*ax*u+2*bx)*u+cx; if(Math.abs(d)<1e-6) break; u-=x/d; }
      u=Math.min(1,Math.max(0,u)); return ((ay*u+by)*u+cy)*u;
    };
  }
  var E=bez(.4,.4,.2,1);

  // Motion state at time t (0..1): radius, slight ellipse, tilt and organic wobble
  function sample(t,R0,Rf,seed){
    var k=Math.min(1,t*1.15);
    return {R:R0+(Rf-R0)*E(t), ecc:.05*Math.sin(Math.PI*k), rot:seed+t*.9, ph:seed*3+t*2.6, amp:.018+.032*Math.sin(Math.PI*Math.min(1,t*1.1)), t:t};
  }
  function series(R0,Rf,seed,lag,steps){
    var a=[],t,j; for(j=0;j<=steps;j++){ t=j/steps; a.push(sample(lag?Math.max(0,(t-lag)/(1-lag)):t,R0,Rf,seed)); } return a;
  }
  function poly(ox,oy,s,div){
    var p=[],a,f,r,A=s.R*(1+s.ecc)/div,B=s.R*(1-s.ecc)/div;
    for(var i=0;i<N;i++){
      a=i/N*TAU; f=a-s.rot;
      r=A*B/Math.sqrt(Math.pow(B*Math.cos(f),2)+Math.pow(A*Math.sin(f),2));
      r*=1+s.amp*(.55*Math.sin(3*a+s.ph)+.45*Math.sin(5*a-1.3*s.ph+1.7));
      p.push((ox+Math.cos(a)*r).toFixed(2)+"px "+(oy+Math.sin(a)*r).toFixed(2)+"px");
    }
    return "polygon("+p.join(",")+")";
  }
  function tf(s,base,dx,dy){
    return (dx||dy?"translate("+dx.toFixed(1)+"px,"+dy.toFixed(1)+"px) ":"")+"rotate("+s.rot.toFixed(3)+"rad) scale("+(s.R*(1+s.ecc)/base).toFixed(3)+","+(s.R*(1-s.ecc)/base).toFixed(3)+")";
  }
  function layer(cls,ox,oy,first){
    var d=document.createElement("div"); d.className="cc-fx "+cls; d.style.left=ox+"px"; d.style.top=oy+"px";
    if(first) d.style.transform=first; document.body.appendChild(d); return d;
  }

  // Toggle icon: rotate + scale with a small spring (the emoji / knob already shows the new theme)
  function pulse(c,host,dur){
    var t=host===c?c:(host.querySelector(".theme-slider")||host);
    var kf=host===c
      ? [{transform:"rotate(0deg) scale(1)"},{transform:"rotate(-130deg) scale(.5)",offset:.34},{transform:"rotate(24deg) scale(1.2)",offset:.66},{transform:"rotate(-6deg) scale(.96)",offset:.84},{transform:"rotate(0deg) scale(1)"}]
      : [{transform:"rotate(0deg) scale(1)"},{transform:"rotate(-6deg) scale(.86)",offset:.34},{transform:"rotate(3deg) scale(1.09)",offset:.66},{transform:"rotate(-1deg) scale(.98)",offset:.84},{transform:"rotate(0deg) scale(1)"}];
    t.animate(kf,{duration:dur*.9,easing:"cubic-bezier(.3,.7,.3,1)"});
  }

  function run(c,host){
    var flip=function(){ passing=true; try{ c.click(); }finally{ passing=false; } };
    var lite=root.getAttribute("data-perf")==="lite";
    var r=host.getBoundingClientRect(), ox=r.left+r.width/2, oy=r.top+r.height/2;
    var vw=root.clientWidth, vh=window.innerHeight, cx=vw/2, cy=vh/2;
    var far=Math.max(Math.hypot(ox,oy),Math.hypot(vw-ox,oy),Math.hypot(ox,vh-oy),Math.hypot(vw-ox,vh-oy));
    var R0=Math.max(r.width,r.height)*.55, Rf=far*1.12, dur=lite?460:800, seed=(ox+oy)%6.28;
    var S=series(R0,Rf,seed,0,STEPS);
    busy=true;

    if(typeof document.startViewTransition!=="function"){ fallback(); return; }

    var L=[], vt;
    function done(){ L.forEach(function(d){d.remove();}); root.classList.remove("cc-vt"); root.style.removeProperty("--cc-ox"); root.style.removeProperty("--cc-oy"); busy=false; }
    root.style.setProperty("--cc-ox",ox.toFixed(1)+"px"); root.style.setProperty("--cc-oy",oy.toFixed(1)+"px");
    root.classList.add("cc-vt");
    try{
      vt=document.startViewTransition(function(){
        flip();
        if(!lite){
          var W=series(R0,Rf,seed,.2,STEPS), Ec=series(R0,Rf,seed,.11,STEPS);
          L.push(layer("wash",ox,oy,tf(W[0],93)), layer("shade",ox,oy,tf(S[0],94)), layer("glow",ox,oy,tf(S[0],93)),
                 layer("echo",ox,oy,tf(Ec[0],93)), layer("core",ox,oy,"scale(.25)"));
          L.W=W; L.Ec=Ec;
        }
      });
    }catch(e){ done(); flip(); return; }
    vt.finished.then(done,done);
    vt.ready.then(function(){
      var lin={duration:dur,easing:"linear",fill:"both"};
      var pe=function(n,d){ return {duration:d||dur,easing:"linear",fill:"both",pseudoElement:"::view-transition-new("+n+")"}; };
      var sc=function(s){ return 1+(lite?0:SETTLE)*(1-E(s.t)); };
      // 1) the reveal: organic edge; the new theme also settles in from a slight push-in (edge is compensated so it matches the rim)
      root.animate({clipPath:S.map(function(s){return poly(ox,oy,s,sc(s));})},pe("root"));
      if(!lite) root.animate({transform:S.map(function(s){return "scale("+sc(s).toFixed(4)+")";})},pe("root"));
      pulse(c,host,dur);
      if(lite||!L.length) return;
      // 2) light layers: all follow the same sampled curve; trailing ones lag so the edge has depth
      var dl=Math.hypot(cx-ox,cy-oy)||1, ux=(cx-ox)/dl, uy=(cy-oy)/dl, W=L.W, Ec=L.Ec;
      L[0].animate({transform:W.map(function(s){return tf(s,93);})},lin);
      L[1].animate({transform:S.map(function(s){return tf(s,94,ux*s.R*.035,uy*s.R*.035);})},lin);
      L[2].animate({transform:S.map(function(s){return tf(s,93);})},lin);
      L[3].animate({transform:Ec.map(function(s){return tf(s,93);})},lin);
      L[4].animate([{transform:"scale(.25)"},{transform:"scale("+Math.min(Rf*.5,far*.5)/100+")"}],{duration:dur*.6,easing:"cubic-bezier(.2,.7,.3,1)",fill:"both"});
      root.animate({opacity:[0,.6,.5,.2,0],offset:[0,.15,.5,.8,.92]},pe("cc-wash"));
      root.animate({opacity:[0,.7,.7,.35,0],offset:[0,.1,.5,.78,.95]},pe("cc-shade"));
      root.animate({opacity:[0,.85,.85,.55,0],offset:[0,.07,.5,.75,.94]},pe("cc-glow"));
      root.animate({opacity:[0,0,.55,.45,0],offset:[0,.05,.2,.55,.9]},pe("cc-echo"));
      root.animate({opacity:[0,1,.55,0],offset:[0,.1,.3,1]},pe("cc-core",dur*.6));
    },function(){});
    setTimeout(function(){ try{ vt.skipTransition(); }catch(e){} },dur+1800);

    function fallback(){
      var orb=layer("orb",ox,oy,"scale(.1)"), a;
      root.classList.add("cc-fade"); flip(); pulse(c,host,dur);
      a=orb.animate([{transform:"scale(.1)",opacity:0},{transform:"scale("+(Rf*.55/100).toFixed(2)+")",opacity:.95,offset:.3},{transform:"scale("+(Rf/93).toFixed(2)+")",opacity:0}],{duration:dur,easing:"cubic-bezier(.22,.7,.28,1)",fill:"both"});
      var end=function(){ orb.remove(); root.classList.remove("cc-fade"); busy=false; };
      a.onfinish=end; a.oncancel=end; setTimeout(end,dur+400);
    }
  }

  document.addEventListener("click",function(e){
    if(passing) return;
    var c=document.getElementById("theme"); if(!c) return;
    var host=c.closest("label.theme-switch")||c;
    if(!host.contains(e.target)||c.disabled) return;
    if(reduce.matches) return;                       // reduced motion: existing instant switch, untouched
    e.preventDefault(); e.stopImmediatePropagation();
    if(busy) return;                                 // ignore rapid clicks while one is playing
    run(c,host);
  },true);
})();
</script>
<style id="campuscash-ambient">
/* ===== CampusCash colour system: "Mulberry Noir x Saffron" =====
   60%  base   : mulberry-black (dark) / oat-milk cream (light), with soft saffron + rose light
   30%  glass  : plum glass (dark) / warm-white glass (light), nav, dock, cards, fields
   10%  accent : saffron (dark) / paprika (light) for buttons, links, highlights
   The background is a fixed full-screen layer so it works on every device (iOS ignores background-attachment:fixed). */

/* ---- light theme (default) ---- */
:root {
  --bg:#F6ECE1; --ink:#2A0F1F; --mu:#6B4D5F; --ac:#B8460E; --ac2:#E0711F; --bt:#FFF7EC;
  --lime:#FFC04D; --co:#C71F4B;
  --gl:rgba(255,250,244,.60); --gb:rgba(255,255,255,.72); --fi:rgba(122,40,80,.085);
  --sh:0 1px 2px rgba(80,20,50,.07),0 18px 40px -16px rgba(130,30,70,.32);
  --g1a:#B8460E; --g1b:#E0711F; --g2a:#C71F4B; --g2b:#D9730D; --g3a:#C0407E; --g3b:#D9640D;
  --pol-tint:rgba(184,70,14,.10); --pol-glow:rgba(184,70,14,.30); --pol-dlg:rgba(255,250,244,.96);
  --color-ink-deep:#2A0F1F; --color-warning:#D9730D; --color-scrim:rgba(42,15,31,.42);
  --shadow-plus:0 4px 16px rgba(210,110,20,.45);
  color-scheme:light;
}
:root[data-perf="lite"]{--fi:rgba(122,40,80,.085); --lm-surface:rgba(255,250,244,.93); --lm-solid:#FFF9F2; --lm-line:rgba(120,40,80,.14); --lm-shadow:0 1px 2px rgba(80,20,50,.08),0 4px 12px -6px rgba(80,20,50,.18);}

/* ---- dark theme ---- */
:root[data-theme="dark"] {
  --bg:#150711; --ink:#FBEEE6; --mu:#CDB0BF; --ac:#FFB43B; --ac2:#FFD98A; --bt:#2B1300;
  --lime:#FFC857; --co:#FF7A6B;
  --gl:rgba(88,30,62,.46); --gb:rgba(255,205,232,.17); --fi:rgba(255,225,240,.075);
  --sh:0 1px 2px rgba(0,0,0,.45),0 20px 44px -16px rgba(0,0,0,.72);
  --g1a:#FFB43B; --g1b:#FF8A5B; --g2a:#FF7A6B; --g2b:#FFC857; --g3a:#FF8FB8; --g3b:#FFDC8A;
  --pol-tint:rgba(255,180,59,.15); --pol-glow:rgba(255,180,59,.30); --pol-dlg:rgba(38,12,30,.97);
  --color-ink-deep:#2B1300; --color-warning:#FFC857; --color-scrim:rgba(14,4,11,.6);
  --shadow-plus:0 4px 18px rgba(255,170,50,.5);
  color-scheme:dark;
}
:root[data-perf="lite"][data-theme="dark"]{ --fi:rgba(255,225,240,.075); --lm-surface:rgba(48,17,38,.94); --lm-solid:#2A0E22; --lm-line:rgba(255,205,232,.12); --lm-shadow:0 1px 2px rgba(0,0,0,.4),0 4px 12px -6px rgba(0,0,0,.55); }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#150711; --ink:#FBEEE6; --mu:#CDB0BF; --ac:#FFB43B; --ac2:#FFD98A; --bt:#2B1300;
  --lime:#FFC857; --co:#FF7A6B;
  --gl:rgba(88,30,62,.46); --gb:rgba(255,205,232,.17); --fi:rgba(255,225,240,.075);
  --sh:0 1px 2px rgba(0,0,0,.45),0 20px 44px -16px rgba(0,0,0,.72);
  --g1a:#FFB43B; --g1b:#FF8A5B; --g2a:#FF7A6B; --g2b:#FFC857; --g3a:#FF8FB8; --g3b:#FFDC8A;
  --pol-tint:rgba(255,180,59,.15); --pol-glow:rgba(255,180,59,.30); --pol-dlg:rgba(38,12,30,.97);
  --color-ink-deep:#2B1300; --color-warning:#FFC857; --color-scrim:rgba(14,4,11,.6);
  --shadow-plus:0 4px 18px rgba(255,170,50,.5);
  color-scheme:dark;
  }
  :root[data-perf="lite"]:not([data-theme="light"]){ --fi:rgba(255,225,240,.075); --lm-surface:rgba(48,17,38,.94); --lm-solid:#2A0E22; --lm-line:rgba(255,205,232,.12); --lm-shadow:0 1px 2px rgba(0,0,0,.4),0 4px 12px -6px rgba(0,0,0,.55); }
}

/* ---- atmosphere ---- */
body { background: transparent; }
body::before {
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
      radial-gradient(ellipse 95% 60% at 0% 0%, rgba(255,160,70,.55), transparent 80%),
      radial-gradient(ellipse 70% 55% at 100% 36%, rgba(232,100,150,.34), transparent 80%),
      radial-gradient(ellipse 85% 50% at 50% 100%, rgba(255,196,110,.42), transparent 80%),
      linear-gradient(160deg,#FBF1E6 0%,#F6E8DC 55%,#F1DDD0 100%);
}
:root[data-theme="dark"] body::before {
  background:
      radial-gradient(ellipse 95% 60% at 0% 0%, rgba(255,140,55,.42), transparent 80%),
      radial-gradient(ellipse 70% 55% at 100% 38%, rgba(226,62,124,.32), transparent 80%),
      radial-gradient(ellipse 85% 45% at 50% 100%, rgba(176,48,92,.26), transparent 80%),
      linear-gradient(160deg,#1E0818 0%,#150711 55%,#0E040B 100%);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) body::before {
    background:
      radial-gradient(ellipse 95% 60% at 0% 0%, rgba(255,140,55,.42), transparent 80%),
      radial-gradient(ellipse 70% 55% at 100% 38%, rgba(226,62,124,.32), transparent 80%),
      radial-gradient(ellipse 85% 45% at 50% 100%, rgba(176,48,92,.26), transparent 80%),
      linear-gradient(160deg,#1E0818 0%,#150711 55%,#0E040B 100%);
  }
}
.bg { display:none; }
/* overview story tints, recoloured to the palette */
.tint i:nth-child(1){background:radial-gradient(60vmax 50vmax at 15% 10%,rgba(255,170,60,.6),transparent 70%)}
.tint i:nth-child(2){background:radial-gradient(60vmax 50vmax at 85% 30%,rgba(232,80,140,.5),transparent 70%)}
.tint i:nth-child(3){background:radial-gradient(60vmax 50vmax at 15% 80%,rgba(255,110,90,.45),transparent 70%),radial-gradient(40vmax 40vmax at 90% 90%,rgba(255,200,90,.4),transparent 70%)}
.tint i:nth-child(4){background:radial-gradient(60vmax 50vmax at 50% 25%,rgba(255,190,80,.5),transparent 70%),radial-gradient(50vmax 40vmax at 10% 90%,rgba(220,70,130,.4),transparent 70%)}

/* ---- hard-coded colours that used to be green ---- */
.cw{background:linear-gradient(135deg,#3A0F2B 0%,#A8325E 55%,#FF9A3C 100%); box-shadow:0 14px 34px rgba(90,20,60,.38),inset 0 1px 0 rgba(255,255,255,.4)}
.cw::before{background:radial-gradient(circle,rgba(255,214,120,.65),transparent 68%)}
.coin{color:#2A0F1F; background:radial-gradient(circle at 32% 26%,#FFF2D0,var(--lime) 42%,#E08A12); box-shadow:0 14px 30px rgba(224,138,18,.42),inset 0 -6px 12px rgba(150,70,0,.25),inset 0 4px 8px rgba(255,255,255,.75)}
#gI stop:first-child{stop-color:#D9730D} #gI stop:last-child{stop-color:#F5BE4A}
#gS stop:first-child{stop-color:#C71F4B} #gS stop:last-child{stop-color:#E8602F}
:root[data-theme="dark"] #gI stop:first-child{stop-color:#FFB43B} :root[data-theme="dark"] #gI stop:last-child{stop-color:#FFE08A}
:root[data-theme="dark"] #gS stop:first-child{stop-color:#FF6F9A} :root[data-theme="dark"] #gS stop:last-child{stop-color:#FF9A5B}
.ring #rI{filter:drop-shadow(0 0 3px rgba(255,170,50,.55))}
.ring #rS{filter:drop-shadow(0 0 3px rgba(255,100,130,.5))}
:root[data-perf="lite"] .ring.g.s1{box-shadow:var(--lm-shadow),inset 0 0 0 2px rgba(255,170,50,.5)}
:root[data-perf="lite"] .ring.g.s2{box-shadow:var(--lm-shadow),inset 0 0 0 2px rgba(232,80,120,.5)}
:root[data-perf="lite"] .ring.g.s3{box-shadow:var(--lm-shadow),inset 0 0 0 2px rgba(255,200,90,.75)}
.dock .plus{background:linear-gradient(135deg,var(--lime),#FF9F2E); color:#2A0F1F; box-shadow:0 6px 16px -6px rgba(235,130,20,.65)}
:root[data-perf="lite"] .dock .plus{box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 1px 2px rgba(120,50,0,.28)}
.ring.s1{box-shadow:var(--sh),inset 0 1px 0 var(--gb),0 0 56px rgba(255,170,50,.32)}
.ring.s2{box-shadow:var(--sh),inset 0 1px 0 var(--gb),0 0 56px rgba(232,80,120,.30)}
.ring.s3{box-shadow:var(--sh),inset 0 1px 0 var(--gb),0 0 64px rgba(255,200,90,.5)}
.coin::before{border-color:rgba(60,20,30,.35)}
.coin::after{filter:hue-rotate(0deg)}

/* ===== Glass sliding segmented control (Job/Family/Other, All/Income/Spending, card action) =====
   A glass track with a spring-loaded glider that slides under the selected option. Index is driven by --i, count by --n. */
.seg{position:relative;isolation:isolate;overflow:hidden;--i:0;--n:3;
  -webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  box-shadow:inset 1px 1px 4px var(--gb),inset -1px -1px 6px rgba(40,10,30,.2),0 4px 12px rgba(40,10,30,.14)}
.seg button{position:relative;z-index:1;flex:1 1 0;min-width:0;background:none;letter-spacing:.3px;
  transition:color .3s ease-in-out;-webkit-tap-highlight-color:transparent}
.seg button:hover{color:var(--color-text)}
.seg button.on{background:none;box-shadow:none;color:var(--bt)}
.seg .glider{position:absolute;z-index:0;top:3px;bottom:3px;left:3px;width:calc((100% - 6px) / var(--n));
  border-radius:11px;pointer-events:none;
  background:linear-gradient(135deg,var(--ac),var(--ac2));
  box-shadow:0 0 18px var(--pol-glow),inset 0 0 10px rgba(255,255,255,.35);
  transform:translateX(calc(var(--i) * 100%));
  transition:transform .5s cubic-bezier(.37,1.95,.66,.56),box-shadow .4s ease-in-out}
:root[data-perf="lite"] .seg{-webkit-backdrop-filter:none;backdrop-filter:none}
:root[data-perf="lite"] .seg .glider{box-shadow:inset 0 0 8px rgba(255,255,255,.3)}
@media (prefers-reduced-motion:reduce){.seg .glider{transition:none}}

/* ===== v4.1 motion: tiny, purposeful, and off for Lite Mode / reduced motion ===== */
/* count-up glow */
.flash-up{animation:cc-flash-up .9s ease-out}
.flash-down{animation:cc-flash-down .9s ease-out}
@keyframes cc-flash-up{0%,100%{filter:drop-shadow(0 0 0 rgba(255,190,70,0))}28%{filter:drop-shadow(0 0 12px rgba(255,190,70,.95))}}
@keyframes cc-flash-down{0%,100%{filter:drop-shadow(0 0 0 rgba(255,95,130,0))}28%{filter:drop-shadow(0 0 12px rgba(255,95,130,.9))}}
/* entries land and leave */
.tx-new{border-radius:16px;animation:cc-land .55s cubic-bezier(.2,.9,.25,1.12) both,cc-rowglow 1.9s ease-out .15s}
@keyframes cc-land{from{opacity:0;transform:translateY(-14px) scale(.97)}to{opacity:1;transform:none}}
@keyframes cc-rowglow{0%{background-color:var(--pol-glow)}100%{background-color:transparent}}
.tx-out{height:0!important;padding-top:0!important;padding-bottom:0!important;border-bottom-width:0!important;opacity:0;transform:translateX(30px);overflow:hidden;
  transition:height .26s cubic-bezier(.4,0,.2,1),padding .26s cubic-bezier(.4,0,.2,1),opacity .2s ease-out,transform .26s cubic-bezier(.4,0,.2,1)}
/* save button tick */
.btn.ok{color:transparent!important;position:relative;pointer-events:none}
.btn.ok::after{content:"";position:absolute;left:50%;top:50%;width:.42em;height:.82em;margin:-.5em 0 0 -.21em;border:solid var(--bt);border-width:0 .17em .17em 0;border-radius:1px;transform:rotate(45deg);animation:cc-pop .5s cubic-bezier(.2,1.7,.4,1) both}
@keyframes cc-pop{from{transform:rotate(45deg) scale(.2);opacity:0}to{transform:rotate(45deg) scale(1);opacity:1}}
/* charts + budget */
.bars b{transform-origin:50% 100%}
.bar.pulse-warn{animation:cc-pulse-w 1s ease-out}
.bar.pulse-over{animation:cc-pulse-o 1s ease-out}
@keyframes cc-pulse-w{0%{box-shadow:0 0 0 0 rgba(255,200,87,.85)}35%{box-shadow:0 0 0 8px rgba(255,200,87,0);transform:scaleY(1.55)}100%{box-shadow:0 0 0 0 rgba(255,200,87,0);transform:none}}
@keyframes cc-pulse-o{0%{box-shadow:0 0 0 0 rgba(255,111,107,.9)}35%{box-shadow:0 0 0 8px rgba(255,111,107,0);transform:scaleY(1.55)}100%{box-shadow:0 0 0 0 rgba(255,111,107,0);transform:none}}
/* press feedback: a springy squeeze on everything tappable */
.btn{transition:transform .2s cubic-bezier(.3,1.5,.5,1),filter .2s}
.btn:active{transform:scale(.96)}
.dock button{position:relative;z-index:1;transition:background .2s,color .2s,transform .2s cubic-bezier(.3,1.5,.5,1)}
.dock button:active{transform:scale(.88)}
.seg button{transition:color .3s ease-in-out,transform .2s cubic-bezier(.3,1.5,.5,1)}
.seg button:active{transform:scale(.93)}
.pill{transition:transform .2s cubic-bezier(.3,1.5,.5,1),background .2s,border-color .2s}
.pill:active{transform:scale(.94)}
.x{transition:transform .2s cubic-bezier(.3,1.5,.5,1),background .2s}
.x:active{transform:scale(.82)}
.sw,.theme-switch,.more button{transition:transform .2s cubic-bezier(.3,1.5,.5,1)}
.sw:active{transform:scale(.975)}
.theme-switch:active{transform:scale(.94)}
.more button:active{transform:scale(.97)}
/* dock: one glass highlight that glides between tabs */
.dock{--gx:0px;--gw:0px}
.dock .dock-glider{position:absolute;z-index:0;top:6px;bottom:6px;left:0;width:var(--gw);border-radius:22px;background:var(--pol-tint);
  transform:translateX(var(--gx));opacity:0;pointer-events:none;
  transition:transform .5s cubic-bezier(.37,1.55,.5,1),width .35s cubic-bezier(.3,.9,.3,1),opacity .2s}
.dock.glide .dock-glider{opacity:1}
.dock.glide.no-tr .dock-glider{transition:none}
.dock.glide.on-plus .dock-glider{opacity:0}
.dock.glide button.on:not(.plus){background:none}
.dock button.plus.on{background:linear-gradient(135deg,var(--lime),#FF9F2E);color:#2A0F1F}
/* calm modes */
:root[data-perf="lite"] .flash-up,:root[data-perf="lite"] .flash-down,:root[data-perf="lite"] .tx-new,
:root[data-perf="lite"] .bar.pulse-warn,:root[data-perf="lite"] .bar.pulse-over{animation:none}
:root[data-perf="lite"] .dock .dock-glider{transition-duration:.2s;transition-timing-function:ease-out}
@media (prefers-reduced-motion:reduce){
  .flash-up,.flash-down,.tx-new,.bar.pulse-warn,.bar.pulse-over,.btn.ok::after{animation:none}
  .dock .dock-glider,.dock button,.btn,.seg button,.pill,.x,.sw,.theme-switch,.more button{transition:none}
  .tx-out{transition:none}
}

/* ===== line icons (replace emoji) ===== */
.i{width:1.2em;height:1.2em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.22em;overflow:visible}
.ic .i{width:22px;height:22px;color:var(--ac)}
.btn,.chip,.seg button,.cwf>span{display:inline-flex;align-items:center;justify-content:center;gap:.45em}
.btn .i,.chip .i,.seg button .i,.cwf .i,.cr .i,.pill .i{width:1.12em;height:1.12em}
.x .i{width:19px;height:19px}
.pill{gap:.4em}
.hint b{display:inline-flex}
.hint b .i{width:1em;height:1em}
#theme .i{width:1.2em;height:1.2em;color:var(--ac)}
#leg .i{width:1.05em;height:1.05em;color:var(--mu);margin-right:.2em}
.safe .i{margin-right:.25em;color:var(--ac)}
</style>

-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><path d="M10 11v6"/><path d="M14 11v6"/></symbol><symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></symbol><symbol id="i-moon" viewBox="0 0 24 24"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></symbol><symbol id="i-shield" viewBox="0 0 24 24"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/><path d="m9 12 2 2 4-4"/></symbol></svg>

<script>
const ico=n=>'<svg class="i" aria-hidden="true" focusable="false"><use href="#i-'+n+'"></use></svg>';
(()=>{
const $=i=>document.getElementById(i),R=document.documentElement;
const calm=matchMedia("(prefers-reduced-motion:reduce)").matches;
const money=n=>new Intl.NumberFormat("en-IN",{style:"currency",currency:"INR",maximumFractionDigits:n%1?2:0}).format(n||0);
// theme: shares the main site's saved choice
const ti=()=>$("theme").innerHTML=ico(R.dataset.theme==="dark"?"sun":"moon");ti();
$("theme").onclick=()=>{const n=R.dataset.theme==="dark"?"light":"dark";R.dataset.theme=n;try{localStorage.setItem("cc-theme",n)}catch{}ti()};
// show what was requested (textContent only, so it can't inject anything)
let p=location.pathname+location.search;if(p.length>60)p=p.slice(0,57)+"…";$("path").textContent=p||"/";
// reassure: read-only peek at the saved data, if there is any
try{
  const o=JSON.parse(localStorage.getItem("cc-v3")),d=new Date(),k=d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
  const f=a=>Array.isArray(a)?a.filter(x=>x&&typeof x.date==="string"&&x.date.slice(0,7)===k).reduce((s,x)=>s+(Number(x.amount)||0),0):0;
  if(o&&((o.inc||[]).length||(o.exp||[]).length)){
    const left=f(o.inc)-f(o.exp);
    $("safe").innerHTML=ico("shield")+` Your saved entries are untouched. ${left<0?money(-left)+" over":money(left)+" left"} for ${d.toLocaleDateString("en-IN",{month:"long",year:"numeric"})}.`;
  }
}catch{}
// the coin
const coin=$("coin");
coin.onclick=()=>{
    coin.classList.remove("flip");void coin.offsetWidth;coin.classList.add("flip");
  if(calm)return;
  const r=coin.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
  for(let i=0;i<6;i++){const s=document.createElement("span");s.className="fc";s.textContent="₹";
    s.style.cssText=`left:${x}px;top:${y}px;font-size:${14+Math.random()*14}px;--dx:${(Math.random()-.5)*240}px;--r:${(Math.random()-.5)*140}deg`;
    s.onanimationend=()=>s.remove();document.body.append(s)}
};
coin.addEventListener("animationend",e=>{if(e.animationName==="flip")coin.classList.remove("flip")});
})();
</script>
<script id="cc-haptics">
(()=>{
  // lets :active press feedback work on iOS Safari
  document.addEventListener("touchstart",()=>{},{passive:true});
  const ok=typeof navigator.vibrate==="function"&&!matchMedia("(prefers-reduced-motion:reduce)").matches;
  window.ccBuzz=p=>{if(!ok)return;try{navigator.vibrate(p)}catch(e){}};
  if(!ok)return;
  document.addEventListener("click",e=>{if(e.target.closest(".dock button,.seg button,.pill,.sw,.theme-switch,.btn.alt,.more button"))window.ccBuzz(6)},{passive:true});
  document.addEventListener("change",e=>{if(e.target.matches&&e.target.matches("input[type=checkbox]"))window.ccBuzz(8)});
})();
</script>
